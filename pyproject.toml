[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-knowledge-management-system"
version = "0.1.0"
description = "Local bibliographic JSON importer and SQLite search"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pkm = "pkm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
